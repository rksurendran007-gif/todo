<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit To-Do Item</title>
    <style>
        /* Base Styling & Reset */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        body { 
            background: linear-gradient(135deg, #e0eafc, #cfdef3); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            color: #333; 
        }

        /* Container Box */
        .todo-container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); 
            width: 100%; 
            max-width: 480px; 
        }

        /* Headings */
        h1 { 
            font-size: 1.8rem; 
            font-weight: 700; 
            color: #2c3e50; 
            margin-bottom: 25px; 
            text-align: center; 
        }

        /* Form Styles */
        form { 
            display: flex; 
            flex-direction: column;
            gap: 15px; 
        }

        input[type="text"] { 
            width: 100%;
            padding: 12px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            outline: none; 
            transition: border-color 0.2s ease; 
        }

        input[type="text"]:focus { 
            border-color: #3498db; 
        }

        /* Form Action Layout */
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        /* Buttons (Universal styling for Add, Edit, Delete) */
        button, .btn { 
            flex: 1;
            padding: 12px 20px; 
            border: none; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            text-align: center;
            text-decoration: none;
        }

        /* Specific Action Colors */
        button[type="submit"], .btn-add { 
            background-color: #3498db; 
            color: white; 
        }

        button[type="submit"]:hover, .btn-add:hover { 
            background-color: #2980b9; 
            transform: translateY(-1px); 
        }

        /* Back to list button modifier using style variables */
        .btn-secondary {
            background-color: #f8fafc;
            color: #7f8c8d;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background-color: #edf2f7;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h1>My To-Do List</h1>
        
        <!-- Wrap in a functional form using the layout's input standard -->
        <form method="POST" action="">
            <input type="text" name="task" value="{{ todo.task }}" placeholder="Update task..." required>
            
            <div class="form-actions">
                <button type="submit">Save</button>
                <a href="/" class="btn btn-secondary">Back to list</a>
            </div>
        </form>
    </div>

</body>
</html>
